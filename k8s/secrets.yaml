# Templates only. CI fills base64 values in memory; never commit credentials.
apiVersion: v1
kind: Secret
metadata:
  name: fiapx-video-service
  namespace: fiapx
type: Opaque
data:
  DB_USERNAME: "${DB_USERNAME_B64}"
  DB_PASSWORD: "${DB_PASSWORD_B64}"
  IDENTITY_SERVICE_KEY: "${IDENTITY_SERVICE_KEY_B64}"
  public.pem: "${JWT_PUBLIC_KEY_B64}"
