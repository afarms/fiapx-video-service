spring:
  application:
    name: fiapx-video-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fiapx_video}
    username: ${DB_USERNAME:fiapx_video}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      enabled: ${upload.enabled}
      max-file-size: 100000000B
      max-request-size: 101000000B
      file-size-threshold: 0B
      resolve-lazily: true
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
upload:
  enabled: ${UPLOAD_ENABLED:false}
  region: ${AWS_REGION:us-east-1}
  aws-profile: ${UPLOAD_AWS_PROFILE:}
  bucket: ${MEDIA_BUCKET_NAME:}
  queue-url: ${PROCESSING_QUEUE_URL:}
  publisher-enabled: ${UPLOAD_PUBLISHER_ENABLED:false}
  cleanup-enabled: ${UPLOAD_CLEANUP_ENABLED:true}
  temp-directory: ${UPLOAD_TEMP_DIRECTORY:.local/uploads}
  concurrency: ${UPLOAD_CONCURRENCY:2}
  disk-reserve-bytes: ${UPLOAD_DISK_RESERVE_BYTES:500000000}
  lease-seconds: ${UPLOAD_LEASE_SECONDS:300}
  publisher-delay-ms: ${UPLOAD_PUBLISHER_DELAY_MS:5000}
  processing-reconcile-enabled: ${PROCESSING_RECONCILE_ENABLED:false}
  processing-reconcile-delay-ms: ${PROCESSING_RECONCILE_DELAY_MS:60000}
  cleanup-delay-ms: ${UPLOAD_CLEANUP_DELAY_MS:60000}
download:
  cleanup-enabled: ${RESULT_CLEANUP_ENABLED:false}
  cleanup-delay-ms: ${RESULT_CLEANUP_DELAY_MS:60000}
  cleanup-lease-seconds: ${RESULT_CLEANUP_LEASE_SECONDS:120}
  cleanup-retry-seconds: ${RESULT_CLEANUP_RETRY_SECONDS:300}
  cleanup-batch-size: ${RESULT_CLEANUP_BATCH_SIZE:10}
  enabled: ${DOWNLOAD_ENABLED:false}
  concurrency: ${DOWNLOAD_CONCURRENCY:2}
  lease-seconds: ${DOWNLOAD_LEASE_SECONDS:120}
  heartbeat-seconds: ${DOWNLOAD_HEARTBEAT_SECONDS:30}
  maximum-seconds: ${DOWNLOAD_MAXIMUM_SECONDS:1800}
results:
  enabled: ${PROCESSING_RESULTS_ENABLED:false}
  queue-url: ${VIDEOS_EVENTS_QUEUE_URL:}
  poll-delay-ms: ${PROCESSING_RESULTS_POLL_DELAY_MS:1000}
identity:
  url: ${IDENTITY_URL:http://localhost:8081}
  service-key: ${IDENTITY_SERVICE_KEY}
  connect-timeout-ms: ${IDENTITY_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${IDENTITY_READ_TIMEOUT_MS:3000}
  jwt:
    issuer: ${JWT_ISSUER:fiapx-identity}
    audience: ${JWT_AUDIENCE:fiapx-api}
    public-key: ${JWT_PUBLIC_KEY:file:.local/keys/identity-public.pem}
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
    path: /swagger-ui.html
