name: fiapx-video
services:
  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: fiapx_video
      POSTGRES_USER: fiapx_video
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiapx_video -d fiapx_video"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  video:
    build:
      context: .
      target: runtime
    image: fiapx-video-service:local
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/fiapx_video
      DB_USERNAME: fiapx_video
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in .env}
      API_DOCS_ENABLED: "true"
      SERVER_PORT: ${SERVER_PORT:-8080}
      IDENTITY_URL: ${IDENTITY_DOCKER_URL:-http://host.docker.internal:8081}
      IDENTITY_SERVICE_KEY: ${IDENTITY_SERVICE_KEY:?Define IDENTITY_SERVICE_KEY in .env}
      JWT_PUBLIC_KEY: file:/run/keys/identity-public.pem
      JWT_ISSUER: ${JWT_ISSUER:-fiapx-identity}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-fiapx-api}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
      UPLOAD_ENABLED: ${UPLOAD_ENABLED:-false}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      MEDIA_BUCKET_NAME: ${MEDIA_BUCKET_NAME:-}
      PROCESSING_QUEUE_URL: ${PROCESSING_QUEUE_URL:-}
      PROCESSING_RESULTS_ENABLED: ${PROCESSING_RESULTS_ENABLED:-false}
      VIDEOS_EVENTS_QUEUE_URL: ${VIDEOS_EVENTS_QUEUE_URL:-}
      UPLOAD_PUBLISHER_ENABLED: ${UPLOAD_PUBLISHER_ENABLED:-false}
      PROCESSING_RECONCILE_ENABLED: ${PROCESSING_RECONCILE_ENABLED:-false}
      UPLOAD_CLEANUP_ENABLED: ${UPLOAD_CLEANUP_ENABLED:-true}
      UPLOAD_TEMP_DIRECTORY: /app/.local/uploads
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:${SERVER_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    volumes:
      - upload-temp:/app/.local
      - type: bind
        source: ${IDENTITY_PUBLIC_KEY_PATH:-./.local/keys/identity-public.pem}
        target: /run/keys/identity-public.pem
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
volumes:
  postgres-data:
  upload-temp:
