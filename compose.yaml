name: fiapx-video
services:
  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: fiapx_video
      POSTGRES_USER: fiapx_video
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiapx_video -d fiapx_video"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  video:
    build:
      context: .
      target: runtime
    image: fiapx-video-service:local
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/fiapx_video
      DB_USERNAME: fiapx_video
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in .env}
      API_DOCS_ENABLED: "true"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
volumes:
  postgres-data:
